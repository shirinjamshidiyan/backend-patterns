services:
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761" # Eureka dashboard and API are reachable from the host on localhost:8761.
    environment:
      SERVER_PORT: "8761"
      EUREKA_URL: "http://eureka-server:8761/eureka/" # Self URL used by the standalone server configuration.
      EUREKA_HOSTNAME: "eureka-server"


  inventory-1:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: "8080"
      EUREKA_URL: "http://eureka-server:8761/eureka/"
      INSTANCE_ID: "inventory-1"

    depends_on:
      - eureka-server

  inventory-2:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    ports:
      - "8082:8080"
    environment:

      SERVER_PORT: "8080"
      EUREKA_URL: "http://eureka-server:8761/eureka/"
      INSTANCE_ID: "inventory-2"

    depends_on:
      - eureka-server

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      EUREKA_URL: "http://eureka-server:8761/eureka/"
      INSTANCE_ID: "order-1"

      INVENTORY_BASE_URL: "http://inventory-service/api/v1/inventory"

    depends_on:
      - eureka-server
