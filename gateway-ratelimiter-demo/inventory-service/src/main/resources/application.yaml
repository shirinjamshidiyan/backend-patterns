
spring:
  application:
   name: inventory-service

server:
  port: ${SERVER_PORT:8081}

eureka:

  client:
    fetch-registry: true
    register-with-eureka: true
    healthcheck:
      enabled: true
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    instance-id: ${INSTANCE_ID:${spring.application.name}-${server.port}}
    hostname: ${APP_HOSTNAME:localhost}
    prefer-ip-address: false


management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [correlationId: %X{correlationId}] [calling-service: %X{X-Calling-Service}] %-5level %logger{36} - %msg%n"