services:

  redis:
    image: redis:7-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: "8761"
      EUREKA_HOSTNAME: "eureka-server"

  gateway-service:
    build:
      context: .
      dockerfile: gateway-service/Dockerfile
    ports:
      - "7070:8080"
    environment:
      SERVER_PORT: "8080"
      EUREKA_URL: "http://eureka-server:8761/eureka/"
      EUREKA_BASE_URL: "http://eureka-server:8761"
      INSTANCE_ID: "gateway-1"
      APP_HOSTNAME: "gateway-service"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      eureka-server:
        condition: service_started
      redis:
        condition: service_started

  inventory-1:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: "8080"
      EUREKA_URL: "http://eureka-server:8761/eureka/"
      INSTANCE_ID: "inventory-1"
      APP_HOSTNAME: "inventory-1"

    depends_on:
      eureka-server:
        condition: service_started

  inventory-2:
    build:
      context: .
      dockerfile: inventory-service/Dockerfile
    ports:
      - "8082:8080"
    environment:

      SERVER_PORT: "8080"
      EUREKA_URL: "http://eureka-server:8761/eureka/"
      INSTANCE_ID: "inventory-2"
      APP_HOSTNAME: "inventory-2"

    depends_on:
      eureka-server:
        condition: service_started

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    ports:
      - "8085:8080"
    environment:
      SERVER_PORT: "8080"
      EUREKA_URL: "http://eureka-server:8761/eureka/"
      INSTANCE_ID: "order-1"
      APP_HOSTNAME: "order-service"

    depends_on:
      eureka-server:
        condition: service_started

